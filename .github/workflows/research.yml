name: KanzQuant research update
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: kanzquant-research-update
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      KANZQUANT_DATA_MODE: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_fred.py --since 2024-01-01
      - run: python scripts/ingest_market.py
      - run: python scripts/run_research.py
